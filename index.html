<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PAIN LEGENDS</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020205;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  top:18px;
  left:18px;
  z-index:10;
  color:white;
  text-shadow:0 2px 6px #000;
  pointer-events:none;
}

#title{
  color:#ff2020;
  font-size:23px;
  font-weight:900;
  letter-spacing:3px;
}

#score{
  margin-top:6px;
  font-size:18px;
  font-weight:bold;
}

#speed{
  margin-top:4px;
  font-size:13px;
  opacity:.8;
}

#message{
  position:fixed;
  z-index:20;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:white;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  text-shadow:0 3px 12px #000;
  pointer-events:none;
}

#status{
  margin-top:8px;
  color:#ff4040;
  font-size:12px;
  font-weight:normal;
}

#controls{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  opacity:.45;
  font-size:12px;
  z-index:10;
}
</style>
</head>

<body>

<div id="hud">
  <div id="title">PAIN LEGENDS</div>
  <div id="score">SCORE: 0</div>
  <div id="speed">SPEED: 10</div>
</div>

<div id="message">
  LOADING NINJA...
  <div id="status"></div>
</div>

<div id="controls">
  SWIPE ← → &nbsp; ↑ JUMP &nbsp; ↓ SLIDE
</div>


<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x020205);

scene.fog =
  new THREE.FogExp2(
    0x05050b,
    0.018
  );


/* =====================================================
   CAMERA
===================================================== */

const camera =
  new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    0.1,
    300
  );

camera.position.set(
  0,
  4.2,
  8.5
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1.15;

document.body.appendChild(
  renderer.domElement
);


/* =====================================================
   LIGHTS
===================================================== */

const hemi =
  new THREE.HemisphereLight(
    0x7180aa,
    0x080808,
    2
  );

scene.add(hemi);


const moon =
  new THREE.DirectionalLight(
    0xaac0ff,
    2.5
  );

moon.position.set(
  -8,
  15,
  10
);

moon.castShadow = true;

moon.shadow.mapSize.width =
  1024;

moon.shadow.mapSize.height =
  1024;

scene.add(moon);


const redLight =
  new THREE.PointLight(
    0xff1010,
    8,
    35
  );

redLight.position.set(
  0,
  4,
  5
);

scene.add(redLight);


/* =====================================================
   ROAD
===================================================== */

const road =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      12,
      500
    ),
    new THREE.MeshStandardMaterial({
      color:0x111217,
      roughness:.3,
      metalness:.6
    })
  );

road.rotation.x =
  -Math.PI / 2;

road.position.z =
  -180;

road.receiveShadow = true;

scene.add(road);


/* =====================================================
   LANES
===================================================== */

for(const x of [-2,2]){

  const line =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .07,
        .025,
        500
      ),
      new THREE.MeshBasicMaterial({
        color:0x707784
      })
    );

  line.position.set(
    x,
    .03,
    -180
  );

  scene.add(line);
}


/* =====================================================
   CITY
===================================================== */

function createBuilding(
  x,
  z,
  w,
  h,
  d
){

  const b =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      new THREE.MeshStandardMaterial({
        color:0x070914,
        roughness:.9
      })
    );

  b.position.set(
    x,
    h/2,
    z
  );

  b.castShadow = true;

  scene.add(b);


  for(
    let y=2;
    y<h-1;
    y+=2.4
  ){

    for(
      let wx=-w/2+.6;
      wx<w/2;
      wx+=1.4
    ){

      const win =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .4,
            .6,
            .03
          ),
          new THREE.MeshBasicMaterial({
            color:
              Math.random()>.35
              ? 0xff3030
              : 0x263044
          })
        );

      win.position.set(
        x+wx,
        y,
        z-d/2-.02
      );

      scene.add(win);
    }
  }
}


for(let i=0;i<70;i++){

  const z =
    -i*7-10;

  createBuilding(
    -10-Math.random()*4,
    z,
    3+Math.random()*3,
    5+Math.random()*16,
    4
  );

  createBuilding(
    10+Math.random()*4,
    z,
    3+Math.random()*3,
    5+Math.random()*16,
    4
  );
}


/* =====================================================
   STREET LIGHTS
===================================================== */

for(let i=0;i<70;i++){

  const z =
    -i*7-8;

  for(const x of [-5.8,5.8]){

    const pole =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .04,.04,3
        ),
        new THREE.MeshStandardMaterial({
          color:0x222222
        })
      );

    pole.position.set(
      x,
      1.5,
      z
    );

    scene.add(pole);


    const light =
      new THREE.PointLight(
        0xff2020,
        2,
        7
      );

    light.position.set(
      x,
      3,
      z
    );

    scene.add(light);
  }
}


/* =====================================================
   PLAYER
===================================================== */

const player =
  new THREE.Group();

player.position.set(
  0,
  0,
  2
);

scene.add(player);


/* =====================================================
   NINJA
===================================================== */

let ninja = null;

let mixer = null;

let runAction = null;

let jumpAction = null;

let slideAction = null;

const loader =
  new GLTFLoader();


loader.load(

  "./ninja_root.glb",

  function(gltf){

    console.log(
      "NINJA LOADED"
    );

    ninja =
      gltf.scene;


    /* MODEL SCALE */

    const box =
      new THREE.Box3()
        .setFromObject(ninja);

    const size =
      new THREE.Vector3();

    box.getSize(size);


    if(size.y > 0){

      const scale =
        2.7 / size.y;

      ninja.scale.setScalar(
        scale
      );
    }


    /* CENTER MODEL */

    const box2 =
      new THREE.Box3()
        .setFromObject(ninja);

    const center =
      new THREE.Vector3();

    box2.getCenter(center);


    ninja.position.x =
      -center.x;

    ninja.position.z =
      -center.z;

    ninja.position.y =
      -box2.min.y;


    /* SHADOWS */

    ninja.traverse(
      function(obj){

        if(obj.isMesh){

          obj.castShadow = true;

          obj.receiveShadow = true;
        }

      }
    );


    /*
      Face forward.
      If the ninja faces backwards,
      change Math.PI to 0.
    */

    ninja.rotation.y =
      Math.PI;


    player.add(ninja);


    /* =================================================
       ANIMATIONS
    ================================================= */

    if(
      gltf.animations &&
      gltf.animations.length > 0
    ){

      mixer =
        new THREE.AnimationMixer(
          ninja
        );


      console.log(
        "AVAILABLE ANIMATIONS:"
      );

      gltf.animations.forEach(
        function(animation){

          console.log(
            animation.name
          );

        }
      );


      /* RUN */

      const runClip =
        gltf.animations.find(
          function(a){

            return /run|running|jog|walk/i
              .test(a.name);

          }
        );


      if(runClip){

        runAction =
          mixer.clipAction(
            runClip
          );

        runAction.play();

        runAction.timeScale =
          1.15;
      }


      /* JUMP */

      const jumpClip =
        gltf.animations.find(
          function(a){

            return /jump/i
              .test(a.name);

          }
        );


      if(jumpClip){

        jumpAction =
          mixer.clipAction(
            jumpClip
          );

        jumpAction.loop =
          THREE.LoopOnce;

        jumpAction.clampWhenFinished =
          true;
      }


      /* SLIDE */

      const slideClip =
        gltf.animations.find(
          function(a){

            return /slide|crouch|duck/i
              .test(a.name);

          }
        );


      if(slideClip){

        slideAction =
          mixer.clipAction(
            slideClip
          );

        slideAction.loop =
          THREE.LoopOnce;

        slideAction.clampWhenFinished =
          true;
      }

    }


    document.getElementById(
      "message"
    ).innerHTML = "";

  },


  function(progress){

    if(progress.total){

      const percent =
        Math.round(
          progress.loaded /
          progress.total * 100
        );

      document.getElementById(
        "status"
      ).textContent =
        "Loading: " +
        percent +
        "%";
    }

  },


  function(error){

    console.error(
      error
    );

    document.getElementById(
      "message"
    ).innerHTML =
      "🥷 NINJA ERROR";

    document.getElementById(
      "status"
    ).textContent =
      "Could not load ninja_root.glb";
  }

);


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

let lane = 0;

let targetX = 0;

const laneWidth = 2;


function moveLeft(){

  if(lane > -1){

    lane--;

    targetX =
      lane * laneWidth;
  }
}


function moveRight(){

  if(lane < 1){

    lane++;

    targetX =
      lane * laneWidth;
  }
}


/* =====================================================
   JUMP
===================================================== */

let jumping = false;

let jumpVelocity = 0;

const gravity = 22;


function jump(){

  if(jumping)
    return;


  jumping = true;

  jumpVelocity = 9;


  if(jumpAction){

    if(runAction)
      runAction.fadeOut(.12);

    jumpAction.reset();

    jumpAction.fadeIn(.12);

    jumpAction.play();
  }
}


/* =====================================================
   SLIDE
===================================================== */

let sliding = false;

let slideTimer = 0;


function slide(){

  if(jumping)
    return;

  if(sliding)
    return;


  sliding = true;

  slideTimer = .7;


  if(slideAction){

    if(runAction)
      runAction.fadeOut(.12);

    slideAction.reset();

    slideAction.fadeIn(.12);

    slideAction.play();
  }
}


/* =====================================================
   TOUCH SWIPE
===================================================== */

let startX = 0;

let startY = 0;


renderer.domElement.addEventListener(
  "touchstart",
  function(e){

    const t =
      e.touches[0];

    startX =
      t.clientX;

    startY =
      t.clientY;

  },
  {passive:true}
);


renderer.domElement.addEventListener(
  "touchend",
  function(e){

    const t =
      e.changedTouches[0];

    const dx =
      t.clientX-startX;

    const dy =
      t.clientY-startY;


    if(
      Math.abs(dx) < 40 &&
      Math.abs(dy) < 40
    ){

      return;
    }


    if(
      Math.abs(dx) >
      Math.abs(dy)
    ){

      if(dx > 0){

        moveRight();

      }else{

        moveLeft();
      }

    }else{

      if(dy < 0){

        jump();

      }else{

        slide();

      }
    }

  },
  {passive:true}
);


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
  "keydown",
  function(e){

    if(e.key === "ArrowLeft")
      moveLeft();

    if(e.key === "ArrowRight")
      moveRight();

    if(e.key === "ArrowUp")
      jump();

    if(e.key === "ArrowDown")
      slide();

  }
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let score = 0;

let speed = 10;

let lastTime =
  performance.now();


/* =====================================================
   ANIMATION LOOP
===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );


  const now =
    performance.now();

  const dt =
    Math.min(
      (now-lastTime)/1000,
      .05
    );

  lastTime = now;


  /* SPEED */

  speed +=
    dt*.025;

  score +=
    dt*speed;


  /* =================================================
     LANE MOVEMENT
  ================================================= */

  player.position.x +=
    (
      targetX -
      player.position.x
    ) *
    Math.min(
      1,
      dt*10
    );


  /* =================================================
     JUMP PHYSICS
  ================================================= */

  if(jumping){

    player.position.y +=
      jumpVelocity * dt;

    jumpVelocity -=
      gravity * dt;


    if(
      player.position.y <= 0
    ){

      player.position.y = 0;

      jumping = false;

      jumpVelocity = 0;


      if(runAction){

        if(jumpAction)
          jumpAction.fadeOut(.12);

        runAction.reset();

        runAction.fadeIn(.12);

        runAction.play();
      }

    }
  }


  /* =================================================
     SLIDE TIMER
  ================================================= */

  if(sliding){

    slideTimer -= dt;


    if(slideTimer <= 0){

      sliding = false;


      if(runAction){

        if(slideAction)
          slideAction.fadeOut(.12);

        runAction.reset();

        runAction.fadeIn(.12);

        runAction.play();
      }

    }
  }


  /* =================================================
     ANIMATION MIXER
  ================================================= */

  if(mixer){

    mixer.update(dt);
  }


  /* =================================================
     CAMERA
  ================================================= */

  const desiredCamera =
    new THREE.Vector3(
      player.position.x*.35,
      4.2 + player.position.y*.15,
      8.5
    );


  camera.position.lerp(
    desiredCamera,
    Math.min(
      1,
      dt*4
    )
  );


  camera.lookAt(
    player.position.x,
    1.4 + player.position.y*.3,
    -8
  );


  /* =================================================
     HUD
  ================================================= */

  document.getElementById(
    "score"
  ).textContent =
    "SCORE: " +
    Math.floor(score);


  document.getElementById(
    "speed"
  ).textContent =
    "SPEED: " +
    Math.floor(speed);


  renderer.render(
    scene,
    camera
  );
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  function(){

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* START */

animate();

</script>

</body>
</html>
