<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PAIN LEGENDS</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020204;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  top:18px;
  left:18px;
  z-index:10;
  color:white;
  pointer-events:none;
  text-shadow:0 2px 5px #000;
}

#title{
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
  color:#ff3030;
}

#score{
  margin-top:6px;
  font-size:18px;
  font-weight:bold;
}

#speed{
  margin-top:3px;
  font-size:13px;
  opacity:.8;
}

#message{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  z-index:20;
  pointer-events:none;
  text-shadow:0 3px 10px #000;
}

#controls{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  opacity:.45;
  font-size:12px;
  z-index:10;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="hud">
  <div id="title">PAIN LEGENDS</div>
  <div id="score">SCORE: 0</div>
  <div id="speed">SPEED: 0</div>
</div>

<div id="message">SWIPE TO MOVE</div>
<div id="controls">SWIPE ← →</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020205);

scene.fog = new THREE.FogExp2(
  0x05050a,
  0.018
);


/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
  60,
  innerWidth / innerHeight,
  0.1,
  300
);

camera.position.set(
  0,
  5,
  9
);


/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   LIGHTS
========================= */

const hemi = new THREE.HemisphereLight(
  0x6677aa,
  0x080808,
  1.8
);

scene.add(hemi);


const moon = new THREE.DirectionalLight(
  0x9db8ff,
  2.4
);

moon.position.set(
  -8,
  15,
  10
);

moon.castShadow = true;

moon.shadow.mapSize.width = 1024;
moon.shadow.mapSize.height = 1024;

scene.add(moon);


const redLight = new THREE.PointLight(
  0xff2020,
  8,
  35
);

redLight.position.set(
  0,
  4,
  5
);

scene.add(redLight);


/* =========================
   ROAD
========================= */

const roadMaterial =
  new THREE.MeshStandardMaterial({
    color:0x111217,
    roughness:.35,
    metalness:.55
  });

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(
    12,
    500
  ),
  roadMaterial
);

road.rotation.x =
  -Math.PI / 2;

road.position.y = 0;

road.position.z = -180;

road.receiveShadow = true;

scene.add(road);


/* =========================
   ROAD LANES
========================= */

const laneMaterial =
  new THREE.MeshBasicMaterial({
    color:0x555b66
  });

for(let x of [-2,2]){

  const line = new THREE.Mesh(
    new THREE.BoxGeometry(
      .07,
      .02,
      500
    ),
    laneMaterial
  );

  line.position.set(
    x,
    .025,
    -180
  );

  scene.add(line);
}


/* =========================
   ROAD SIDES
========================= */

const sideMaterial =
  new THREE.MeshStandardMaterial({
    color:0x17171b,
    roughness:.8
  });

for(const x of [-7,7]){

  const side = new THREE.Mesh(
    new THREE.BoxGeometry(
      2,
      .25,
      500
    ),
    sideMaterial
  );

  side.position.set(
    x,
    -.1,
    -180
  );

  side.receiveShadow = true;

  scene.add(side);
}


/* =========================
   CITY
========================= */

function createBuilding(
  x,
  z,
  width,
  height,
  depth
){

  const material =
    new THREE.MeshStandardMaterial({
      color:new THREE.Color(
        0.025,
        0.028,
        0.045
      ),
      roughness:.9
    });

  const building =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        depth
      ),
      material
    );

  building.position.set(
    x,
    height/2,
    z
  );

  building.castShadow = true;
  building.receiveShadow = true;

  scene.add(building);


  /* Windows */

  for(
    let y = 2;
    y < height - 1;
    y += 2.3
  ){

    for(
      let wx = -width/2 + .7;
      wx < width/2;
      wx += 1.5
    ){

      const windowLight =
        new THREE.MeshBasicMaterial({
          color:
            Math.random() > .35
            ? 0xff3030
            : 0x263044
        });

      const win =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .45,
            .65,
            .03
          ),
          windowLight
        );

      win.position.set(
        x + wx,
        y,
        z - depth/2 - .02
      );

      scene.add(win);
    }
  }
}


/* Generate city */

for(let i=0;i<70;i++){

  const z = -i * 7 - 10;

  createBuilding(
    -10 - Math.random()*4,
    z,
    3 + Math.random()*3,
    5 + Math.random()*16,
    4
  );

  createBuilding(
    10 + Math.random()*4,
    z,
    3 + Math.random()*3,
    5 + Math.random()*16,
    4
  );
}


/* =========================
   RED STREET LIGHTS
========================= */

for(let i=0;i<80;i++){

  const z = -i * 7 - 8;

  for(const x of [-5.8,5.8]){

    const pole =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .04,
          .04,
          3
        ),
        new THREE.MeshStandardMaterial({
          color:0x222222
        })
      );

    pole.position.set(
      x,
      1.5,
      z
    );

    scene.add(pole);


    const light =
      new THREE.PointLight(
        0xff2020,
        2,
        7
      );

    light.position.set(
      x,
      3,
      z
    );

    scene.add(light);
  }
}


/* =========================
   PLAYER
========================= */

const player =
  new THREE.Group();

player.position.set(
  0,
  0,
  2
);

scene.add(player);


/* =========================
   NINJA MODEL
========================= */

const loader =
  new GLTFLoader();

let ninja = null;
let mixer = null;

loader.load(
  "ninja_root.glb",

  (gltf)=>{

    ninja = gltf.scene;

    /* Model size */

    const box =
      new THREE.Box3()
        .setFromObject(ninja);

    const size =
      new THREE.Vector3();

    box.getSize(size);

    const height =
      size.y;

    if(height > 0){

      const scale =
        2.7 / height;

      ninja.scale.setScalar(
        scale
      );
    }


    /* Center model */

    const box2 =
      new THREE.Box3()
        .setFromObject(ninja);

    const center =
      new THREE.Vector3();

    box2.getCenter(center);

    ninja.position.x -= center.x;
    ninja.position.z -= center.z;
    ninja.position.y -= box2.min.y;


    /* Shadows */

    ninja.traverse(
      (obj)=>{

        if(obj.isMesh){

          obj.castShadow = true;
          obj.receiveShadow = true;

          if(obj.material){

            obj.material.needsUpdate =
              true;
          }
        }
      }
    );


    /*
      Some models face the opposite
      direction.
    */

    ninja.rotation.y =
      Math.PI;


    player.add(ninja);


    /* =====================
       ANIMATIONS
    ===================== */

    if(gltf.animations &&
       gltf.animations.length > 0){

      mixer =
        new THREE.AnimationMixer(
          ninja
        );

      console.log(
        "Animations:",
        gltf.animations.map(
          a => a.name
        )
      );


      /* Try to find running animation */

      let runAnimation =
        gltf.animations.find(
          a =>
            /run|running|jog/i
              .test(a.name)
        );


      if(!runAnimation){

        runAnimation =
          gltf.animations[0];
      }


      const action =
        mixer.clipAction(
          runAnimation
        );

      action.reset();
      action.play();

      action.timeScale = 1.15;
    }

    document.getElementById(
      "message"
    ).style.display = "none";

  },

  (progress)=>{

    if(progress.total){

      console.log(
        "Loading ninja:",
        Math.round(
          progress.loaded /
          progress.total * 100
        ) + "%"
      );
    }

  },

  (error)=>{

    console.error(
      "Ninja loading error:",
      error
    );

    document.getElementById(
      "message"
    ).innerHTML =
      "NINJA MODEL ERROR";

  }
);


/* =========================
   MOVEMENT
========================= */

let lane = 0;

let targetX = 0;

const laneWidth = 2;


/* Smooth movement */

function moveLeft(){

  if(lane > -1){

    lane--;

    targetX =
      lane * laneWidth;
  }
}


function moveRight(){

  if(lane < 1){

    lane++;

    targetX =
      lane * laneWidth;
  }
}


/* =========================
   TOUCH SWIPE
========================= */

let touchStartX = 0;
let touchStartY = 0;

renderer.domElement.addEventListener(
  "touchstart",
  (e)=>{

    const touch =
      e.touches[0];

    touchStartX =
      touch.clientX;

    touchStartY =
      touch.clientY;

  },
  {passive:true}
);


renderer.domElement.addEventListener(
  "touchend",
  (e)=>{

    const touch =
      e.changedTouches[0];

    const dx =
      touch.clientX -
      touchStartX;

    const dy =
      touch.clientY -
      touchStartY;


    if(Math.abs(dx) > 40 &&
       Math.abs(dx) > Math.abs(dy)){

      if(dx > 0){

        moveRight();

      }else{

        moveLeft();

      }
    }

  },
  {passive:true}
);


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  (e)=>{

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      moveLeft();

    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      moveRight();

    }
  }
);


/* =========================
   GAME VARIABLES
========================= */

let score = 0;

let speed = 10;

let lastTime =
  performance.now();

let distance = 0;


/* =========================
   ANIMATION
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  const now =
    performance.now();

  const dt =
    Math.min(
      (now - lastTime) / 1000,
      .05
    );

  lastTime = now;


  /* Increase speed */

  distance += speed * dt;

  speed += dt * .025;

  score += dt * speed;


  /* Ninja lane movement */

  player.position.x +=
    (
      targetX -
      player.position.x
    ) * Math.min(
      1,
      dt * 10
    );


  /* Running bob */

  if(ninja && !mixer){

    ninja.position.y =
      Math.abs(
        Math.sin(
          performance.now() * .012
        )
      ) * .06;
  }


  /* Animation mixer */

  if(mixer){

    mixer.update(dt);
  }


  /* Camera */

  const desiredCamera =
    new THREE.Vector3(
      player.position.x * .35,
      4.2,
      8.5
    );

  camera.position.lerp(
    desiredCamera,
    Math.min(1,dt*4)
  );


  camera.lookAt(
    player.position.x,
    1.5,
    -8
  );


  /* HUD */

  document.getElementById(
    "score"
  ).textContent =
    "SCORE: " +
    Math.floor(score);


  document.getElementById(
    "speed"
  ).textContent =
    "SPEED: " +
    Math.floor(speed);


  renderer.render(
    scene,
    camera
  );
}


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* START */

animate();

</script>

</body>
</html>
