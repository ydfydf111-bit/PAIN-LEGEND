<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PAIN LEGENDS</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020205;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  top:18px;
  left:18px;
  z-index:10;
  color:white;
  text-shadow:0 2px 6px #000;
  pointer-events:none;
}

#title{
  color:#ff2020;
  font-size:23px;
  font-weight:900;
  letter-spacing:3px;
}

#score{
  margin-top:6px;
  font-size:18px;
  font-weight:bold;
}

#speed{
  margin-top:4px;
  font-size:13px;
  opacity:.8;
}

#message{
  position:fixed;
  z-index:20;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:white;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  text-shadow:0 3px 12px #000;
  pointer-events:none;
}

#status{
  margin-top:10px;
  color:#ff4040;
  font-size:13px;
  font-weight:normal;
}

#controls{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  opacity:.45;
  font-size:12px;
  z-index:10;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="hud">
  <div id="title">PAIN LEGENDS</div>
  <div id="score">SCORE: 0</div>
  <div id="speed">SPEED: 10</div>
</div>

<div id="message">
  LOADING NINJA...
  <div id="status"></div>
</div>

<div id="controls">
  SWIPE ← →
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x020205);

scene.fog =
  new THREE.FogExp2(
    0x05050b,
    0.018
  );


/* =========================
   CAMERA
========================= */

const camera =
  new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    0.1,
    300
  );

camera.position.set(
  0,
  4.2,
  8.5
);


/* =========================
   RENDERER
========================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1.15;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   LIGHTING
========================= */

const hemi =
  new THREE.HemisphereLight(
    0x7180aa,
    0x080808,
    2
  );

scene.add(hemi);


const moon =
  new THREE.DirectionalLight(
    0xaac0ff,
    2.5
  );

moon.position.set(
  -8,
  15,
  10
);

moon.castShadow = true;

moon.shadow.mapSize.width = 1024;
moon.shadow.mapSize.height = 1024;

scene.add(moon);


const redLight =
  new THREE.PointLight(
    0xff1010,
    8,
    35
  );

redLight.position.set(
  0,
  4,
  5
);

scene.add(redLight);


/* =========================
   ROAD
========================= */

const road =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      12,
      500
    ),
    new THREE.MeshStandardMaterial({
      color:0x111217,
      roughness:.3,
      metalness:.6
    })
  );

road.rotation.x =
  -Math.PI / 2;

road.position.z =
  -180;

road.receiveShadow = true;

scene.add(road);


/* =========================
   LANE LINES
========================= */

for(const x of [-2,2]){

  const line =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .07,
        .025,
        500
      ),
      new THREE.MeshBasicMaterial({
        color:0x707784
      })
    );

  line.position.set(
    x,
    .03,
    -180
  );

  scene.add(line);
}


/* =========================
   CITY
========================= */

function building(
  x,
  z,
  w,
  h,
  d
){

  const b =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      new THREE.MeshStandardMaterial({
        color:0x070914,
        roughness:.9
      })
    );

  b.position.set(
    x,
    h/2,
    z
  );

  b.castShadow = true;

  scene.add(b);


  for(
    let y=2;
    y<h-1;
    y+=2.4
  ){

    for(
      let wx=-w/2+.6;
      wx<w/2;
      wx+=1.4
    ){

      const win =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .4,
            .6,
            .03
          ),
          new THREE.MeshBasicMaterial({
            color:
              Math.random()>.35
              ? 0xff3030
              : 0x263044
          })
        );

      win.position.set(
        x+wx,
        y,
        z-d/2-.02
      );

      scene.add(win);
    }
  }
}


for(let i=0;i<70;i++){

  const z =
    -i*7-10;

  building(
    -10-Math.random()*4,
    z,
    3+Math.random()*3,
    5+Math.random()*16,
    4
  );

  building(
    10+Math.random()*4,
    z,
    3+Math.random()*3,
    5+Math.random()*16,
    4
  );
}


/* =========================
   RED LIGHTS
========================= */

for(let i=0;i<70;i++){

  const z =
    -i*7-8;

  for(const x of [-5.8,5.8]){

    const pole =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .04,.04,3
        ),
        new THREE.MeshStandardMaterial({
          color:0x222222
        })
      );

    pole.position.set(
      x,
      1.5,
      z
    );

    scene.add(pole);


    const light =
      new THREE.PointLight(
        0xff2020,
        2,
        7
      );

    light.position.set(
      x,
      3,
      z
    );

    scene.add(light);
  }
}


/* =========================
   PLAYER
========================= */

const player =
  new THREE.Group();

player.position.set(
  0,
  0,
  2
);

scene.add(player);


/* =========================
   NINJA
========================= */

let ninja = null;
let mixer = null;

const loader =
  new GLTFLoader();


function setStatus(text){

  document.getElementById(
    "status"
  ).textContent = text;
}


loader.load(

  "./ninja_root.glb",

  function(gltf){

    console.log(
      "NINJA LOADED",
      gltf
    );

    ninja =
      gltf.scene;


    /* Find model size */

    const box =
      new THREE.Box3()
        .setFromObject(ninja);

    const size =
      new THREE.Vector3();

    box.getSize(size);


    /* Automatic scale */

    if(size.y > 0){

      const scale =
        2.7 / size.y;

      ninja.scale.setScalar(
        scale
      );
    }


    /* Recalculate box */

    const box2 =
      new THREE.Box3()
        .setFromObject(ninja);

    const center =
      new THREE.Vector3();

    box2.getCenter(center);


    ninja.position.x =
      -center.x;

    ninja.position.z =
      -center.z;

    ninja.position.y =
      -box2.min.y;


    /* Shadows */

    ninja.traverse(
      function(obj){

        if(obj.isMesh){

          obj.castShadow = true;
          obj.receiveShadow = true;

          if(obj.material){

            obj.material.needsUpdate =
              true;
          }
        }
      }
    );


    /*
      Character orientation
    */

    ninja.rotation.y =
      Math.PI;


    player.add(ninja);


    /* =====================
       ANIMATIONS
    ===================== */

    if(
      gltf.animations &&
      gltf.animations.length
    ){

      mixer =
        new THREE.AnimationMixer(
          ninja
        );


      console.log(
        "ANIMATIONS:",
        gltf.animations.map(
          a=>a.name
        )
      );


      let run =
        gltf.animations.find(
          a =>
            /run|running|jog/i
              .test(a.name)
        );


      if(!run){

        run =
          gltf.animations[0];
      }


      const action =
        mixer.clipAction(run);

      action.reset();

      action.play();

      action.timeScale =
        1.15;
    }


    document.getElementById(
      "message"
    ).innerHTML = "";

  },


  function(progress){

    if(progress.total){

      const percent =
        Math.round(
          progress.loaded /
          progress.total * 100
        );

      setStatus(
        "Loading: " +
        percent +
        "%"
      );
    }
  },


  function(error){

    console.error(
      "NINJA LOAD ERROR:",
      error
    );

    document.getElementById(
      "message"
    ).innerHTML =
      "🥷 NINJA ERROR";

    setStatus(
      "Could not load ninja_root.glb"
    );
  }

);


/* =========================
   LANES
========================= */

let lane = 0;

let targetX = 0;

const laneWidth = 2;


function moveLeft(){

  if(lane > -1){

    lane--;

    targetX =
      lane * laneWidth;
  }
}


function moveRight(){

  if(lane < 1){

    lane++;

    targetX =
      lane * laneWidth;
  }
}


/* =========================
   TOUCH
========================= */

let startX = 0;
let startY = 0;


renderer.domElement.addEventListener(
  "touchstart",
  function(e){

    const t =
      e.touches[0];

    startX =
      t.clientX;

    startY =
      t.clientY;

  },
  {passive:true}
);


renderer.domElement.addEventListener(
  "touchend",
  function(e){

    const t =
      e.changedTouches[0];

    const dx =
      t.clientX-startX;

    const dy =
      t.clientY-startY;


    if(
      Math.abs(dx)>40 &&
      Math.abs(dx)>Math.abs(dy)
    ){

      if(dx>0){

        moveRight();

      }else{

        moveLeft();
      }
    }

  },
  {passive:true}
);


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      moveLeft();
    }


    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      moveRight();
    }

  }
);


/* =========================
   GAME
========================= */

let score = 0;
let speed = 10;

let last =
  performance.now();


/* =========================
   LOOP
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  const now =
    performance.now();

  const dt =
    Math.min(
      (now-last)/1000,
      .05
    );

  last = now;


  /* Speed */

  speed +=
    dt*.025;

  score +=
    dt*speed;


  /* Player */

  player.position.x +=
    (
      targetX -
      player.position.x
    ) *
    Math.min(
      1,
      dt*10
    );


  /* Simple bob */

  if(
    ninja &&
    !mixer
  ){

    ninja.position.y =
      Math.abs(
        Math.sin(
          performance.now()*.012
        )
      )*.06;
  }


  /* Animation */

  if(mixer){

    mixer.update(dt);
  }


  /* Camera */

  const cameraTarget =
    new THREE.Vector3(
      player.position.x*.35,
      4.2,
      8.5
    );

  camera.position.lerp(
    cameraTarget,
    Math.min(
      1,
      dt*4
    )
  );


  camera.lookAt(
    player.position.x,
    1.4,
    -8
  );


  /* HUD */

  document.getElementById(
    "score"
  ).textContent =
    "SCORE: " +
    Math.floor(score);


  document.getElementById(
    "speed"
  ).textContent =
    "SPEED: " +
    Math.floor(speed);


  renderer.render(
    scene,
    camera
  );
}


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  function(){

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* START */

animate();

</script>

</body>
</html>
